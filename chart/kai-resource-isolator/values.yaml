nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: docker.io
  repository: projecthami/kai-resource-isolator
  tag: latest
  pullPolicy: IfNotPresent

paths:
  containerVgpuMount: /usr/local/vgpu

webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  ## Comma-separated extended resources that trigger injection (HAMi vGPU sharing)
  gpuShareResources: "nvidia.com/gpu,nvidia.com/gpumem,nvidia.com/gpucores"
  failurePolicy: Ignore

tls:
  ## When cert-manager is enabled, set patch.enabled to false.
  certManager:
    enabled: false
    createSelfSignedClusterIssuer: true
    issuerRef:
      kind: ClusterIssuer
      name: selfsigned
  patch:
    enabled: true
    image:
      registry: docker.io
      repository: jettech/kube-webhook-certgen
      tag: v1.5.2
      pullPolicy: IfNotPresent
    imageNew:
      registry: docker.io
      repository: liangjw/kube-webhook-certgen
      tag: v1.1.1
      pullPolicy: IfNotPresent
    runAsUser: 2000
    nodeSelector: {}
    tolerations: []

service:
  type: ClusterIP
  port: 443

rbac:
  create: true
